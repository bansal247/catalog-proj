version: '3.8'

services:
  spanner-emulator:
    image: gcr.io/cloud-spanner-emulator/emulator:latest
    ports:
      - "9010:9010"   # gRPC endpoint
      - "9020:9020"   # REST endpoint
    environment:
      - SPANNER_EMULATOR_HOST=localhost:9010
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9010"]
      interval: 5s
      timeout: 5s
      retries: 10
